}.status.done{background:#e9fbf6;color:#087a64}.activity-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;background:#eae7ef;border-radius:17px;margin:14px 0 5px;position:sticky;top:66px;z-index:3;box-shadow:0 8px 20px rgba(48,35,64,.08)}.activity-tab{min-width:0;height:49px;background:transparent;color:#79737f;border-radius:13px;box-shadow:none;touch-action:manipulation;transition:transform .12s ease,background .2s ease,color .2s ease,box-shadow .2s ease}.activity-tab.active{background:#fff;color:var(--purple);box-shadow:0 4px 12px rgba(48,35,64,.1)}.activity-tab.return.active{color:#0f9076}.tab-count{display:inline-grid;place-items:center;min-width:23px;height:23px;margin-left:5px;padding:0 6px;border-radius:999px;background:#eaddff;color:var(--purple-dark);font-size:11px}.activity-tab.return .tab-count{background:#d8f8ef;color:#087a64}.time-group{margin-top:20px}.time-head{display:flex;align-items:center;gap:10px;margin:0 4px 10px;font-size:13px;font-weight:900;color:#38323e}.time-head:after{content:"";height:1px;background:#dfdbe4;flex:1}.time-head.return{color:#0f9076}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:13px}.card{min-height:128px;display:flex;overflow:hidden;border-radius:20px;background:#fff;border:1px solid rgba(235,232,239,.96);box-shadow:0 8px 24px rgba(48,35,64,.075);transition:transform .18s ease,box-shadow .18s ease}.card.returned{opacity:.72;border-color:#bcefe2}.photo{width:124px;flex:none;margin:10px;border-radius:15px;overflow:hidden;background:linear-gradient(145deg,#f2edfa,#ece8f1);display:grid;place-items:center;color:#a29ca8;font-size:30px}.photo img{width:100%;height:100%;object-fit:cover}.content{padding:17px 16px 15px 4px;min-width:0;flex:1}.titleline{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.name{font-size:16px;line-height:1.38;font-weight:900;color:#211d25}.qty{white-space:nowrap;padding:3px 7px;border-radius:8px;background:#f3eefb;colo     .forgotten-search{margin-top:22px;text-align:left}.forgotten-search .row{align-items:stretch}.forgotten-search input{min-width:0;font-size:16px;font-weight:650;letter-spacing:0}.forgotten-search .field{flex:1}.forgotten-results{margin-top:16px;text-align:left}.forgotten-result{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line);align-items:center}.forgotten-result img{width:64px;height:64px;object-fit:cover;border-radius:12px;background:#f5f2f8}.forgotten-result-body{min-width:0;flex:1}.forgotten-result .location{font-size:16px;margin-top:7px}.forgotten-result .name{overflow-wrap:anywhere}.forgotten-result .meta{margin-top:4px}.forgotten-message{color:var(--dim);font-size:12px;line-height:1.6}.forgotten-message.error{color:#dc2626}.forgotten-search button{flex-shrink:0}@media(max-width:520px){.forgotten-search .field{flex:1 1 100%}.forgotten-search button{width:100%}}

<body>
  <div class="top">대여 물품 위치 확인</div>
  <main class="wrap">
    <section class="intro"><h1>물품 위치를<br />빠르게 확인하세요</h1><p>4자리 사번으로 대여 물품과 창고 보관 위치를 한 번에 확인할 수 있습니다.</p></section>
    <form class="box" id="search-form"><label for="employee-id">사번</label><div class="row"><div class="field date-field"><input id="employee-id" inputmode="numeric" autocomplete="off" autofocus placeholder="4자리 사번" maxlength="4" /></div><button id="submit" type="submit">조회</button></div><div class="error" id="error" hidden></div></form>
    <section class="result" id="result" hidden><div class="summary"><div><div class="caption">대여자</div><div class="number" id="number"></div></div><button type="button" class="status" id="status" hidden></button></div><div class="activity-tabs" role="tablist"><button type="button" class="activity-tab active" id="borrow-tab" role="tab" aria-selected="true">대여 물품 확인 <span class="tab-count" id="borrow-count">0</span></button><button type="button" class="activity-tab return" id="return-tab" role="tab" aria-selected="false">미확인 반납 <span class="tab-count" id="return-count">0</span></button></div><div id="items"></div></section>
  </main>
  <script>
    const BASE = "__LOOKUP_PATH__";
    // 처리 내역(이번 근무일 반납·취소)은 WMS 메인 화면의 '내 대여 조회'로 옮겼다. 그곳의 주소.
    const MAIN_APP_URL = "__MAIN_APP_URL__";
    const form = document.getElementById("search-form"), employeeInput = document.getElementById("employee-id"), button = document.getElementById("submit"), error = document.getElementById("error"), result = document.getElementById("result"), items = document.getElementById("items"), activityTabs = document.querySelector(".activity-tabs"), borrowTab = document.getElementById("borrow-tab"), returnTab = document.getElementById("return-tab");
    const statusButton = document.getElementById("status");
    let loadedItems = [], activeTab = "borrow", contentMinHeight = 0, currentEmployeeId = "", pollTimer = 0, routeNoticePending = false;
    let locationSearchEpoch = 0;
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const timeLabel = (value) => {
      const raw = String(value || "").trim();
      if (!raw) return "시각 미기록";
      if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(raw)) return raw.slice(0, 16);
      const date = new Date(raw);
      return Number.isNaN(date.getTime()) ? raw.slice(0, 16) : new Intl.DateTimeFormat("ko-KR", { timeZone:"Asia/Seoul", year:"numeric", month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" }).format(date);
    };
    const isCancelled = (item) => !!item.cancelled || item.returnSource === "cancel";
    const itemKey = (item) => String(item.key || `${item.eventType}:${item.id}:${item.eventTime}:${item.name}`);
    const progressKey = (tab) => `wms_lookup_flow_v1:${currentEmployeeId}:${tab}`;
    const readDone = (tab) => {
      try { const value = JSON.parse(localStorage.getItem(progressKey(tab)) || "[]"); return Array.isArray(value) ? value.map(String) : []; }
      catch { return []; }
    };
    const writeDone = (tab, keys) => {
      try { localStorage.setItem(progressKey(tab), JSON.stringify(keys)); } catch { /* 진행 중에는 메모리 렌더링을 계속한다. */ }
    };
    const orderedItems = (tab) => {
      // 반납 동선에는 관리자 반납·본인 반납·무인 반납만 올린다. 처리 내역은 WMS의 내 대여 조회로 통합했다.
      // 대여 동선에는 아직 대여 확인(관리자 확인 또는 무인 PC에서 본인 확인)이 안 된 물품만 남긴다.
      // 체크 여부와 상관없이 확인되면 사라진다.
      const selected = loadedItems.filter((item) => tab === "return" ? item.returned && SHELF_RETURN_SOURCES.has(item.returnSource) && !item.returnStepAutoDone : (!item.returned && !item.pickedUp));
      if (tab === "return") return selected;
      return selected.filter((item) => !item.typeLimitExempt).concat(selected.filter((item) => item.typeLimitExempt));
    };
    // 사용자가 아직 "가져갔어요/반납했어요"를 누르지 않은 물품 수. 0이면 그 탭은 숨긴다.
    const pendingCount = (tab) => {
      const doneSet = new Set(readDone(tab));
      return orderedItems(tab).filter((item) => !doneSet.has(itemKey(item))).length;
    };
    // 대여와 반납이 함께 있으면 반납을 먼저 열되, 사용자가 대여 탭으로 직접 전환할 수 있다.
    const nextTab = () => pendingCount("return") ? "return" : pendingCount("borrow") ? "borrow" : "empty";
    const refreshTabs = () => {
      const borrowPending = pendingCount("borrow"), returnPending = pendingCount("return");
      borrowTab.hidden = borrowPending === 0;
      returnTab.hidden = returnPending === 0;
      activityTabs.hidden = borrowPending === 0 && returnPending === 0;
      activityTabs.style.gridTemplateColumns = borrowPending > 0 && returnPending > 0 ? "1fr 1fr" : "1fr";
      document.getElementById("borrow-count").textContent = borrowPending;
      document.getElementById("return-count").textContent = returnPending;
    };
    const RETURN_LABELS = { admin:"관리자 반납 처리 완료", self:"본인 반납 완료", unattended:"무인 반납 완료", cancel:"취소", transfer:"양도", swap:"관리자 물품 교체", damage:"파손 반납" };
    const SHELF_RETURN_SOURCES = new Set(["admin", "self", "unattended"]);
    const variantText = (item) => item.variantPending ? "종류 미정" : item.variantName || (item.variantUnassigned ? "종류 미확인" : "");
    const cardHtml = (item, showLocation = true) => `<article class="card flow-card ${item.returned ? "returned" : ""}"><div class="photo">${item.image ? `<img src="${esc(item.image)}" alt="${esc(item.name)} 사진" />` : "▦"}</div><div class="content"><div class="titleline"><div class="name">${esc(item.name)}</div><div class="qty">× ${Number(item.quantity)||1}</div></div>${variantText(item) ? `<div class="variant">종류 · ${esc(variantText(item))}</div>` : ""}${showLocation ? `<div class="location">${esc(item.location || "위치 미등록")}</div>` : ""}${item.scenarioId ? `<div class="meta">SID ${esc(item.scenarioId)}</div>` : ""}<div class="meta">${item.returned ? (RETURN_LABELS[item.returnSource] || "반납 완료") : "대여 확인 전"} · ${esc(timeLabel(item.eventTime))}</div>${item.typeLimitExempt ? `<div class="exempt-note">한도 제외${item.typeLimitExemptReason ? ` · ${esc(item.typeLimitExemptReason)}` : ""}</div>` : ""}</div></article>`;
    const renderLocationSearch = () => {
      // 자동 조회가 입력 중인 이름·포커스·검색 결과를 지우지 않게 완료 화면을 재사용한다.
      const existing = items.querySelector('#forgotten-form');
      if (existing && existing.dataset.employeeId === currentEmployeeId) return;
      items.innerHTML = `<section class="flow-finished" aria-labelledby="forgotten-title"><div class="flow-finished-icon" aria-hidden="true">✓</div><h2 id="forgotten-title">혹시 놓친 것이 있나요?</h2><p>안내가 끝났어요. 물품 이름을 입력하면 보관 위치를 찾아드려요.</p><form id="forgotten-form" class="forgotten-search" data-employee-id="${esc(currentEmployeeId)}"><label for="forgotten-name">물품 이름</label><div class="row"><div class="field"><input id="forgotten-name" type="search" maxlength="80" required autocomplete="off" placeholder="예: 컵, 가위" /></div><button type="submit">위치 찾기</button></div></form><div id="forgotten-results" class="forgotten-results" role="status" aria-live="polite"></div></section>`;
      const searchForm = items.querySelector('#forgotten-form'), nameInput = items.querySelector('#forgotten-name'), searchButton = searchForm.querySelector('button'), output = items.querySelector('#forgotten-results');
      searchForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const query = nameInput.value.trim();
        if (!query) { nameInput.focus(); return; }
        const employeeId = currentEmployeeId, epoch = ++locationSearchEpoch;
        searchButton.disabled = true; searchButton.textContent = '찾는 중';
        output.innerHTML = '<p class="forgotten-message">물품 위치를 찾고 있어요.</p>';
        const current = () => epoch === locationSearchEpoch && employeeId === currentEmployeeId && items.querySelector('#forgotten-form') === searchForm;
        try {
          const response = await fetch(BASE + '/item-locations?employeeId=' + encodeURIComponent(employeeId) + '&q=' + encodeURIComponent(query), { cache: 'no-store', signal: AbortSignal.timeout(12000) });
          const data = await response.json().catch(() => ({}));
          if (!response.ok || !data.success) throw new Error(data.error || '물품 위치를 찾지 못했습니다. 잠시 후 다시 시도해 주세요.');
          if (!current()) return;
          const matches = data.items || [];
          output.innerHTML = matches.length ? `<p class="forgotten-message">${matches.length}개 물품을 찾았어요.${data.hasMore ? ' 결과가 많으면 이름을 더 자세히 입력해 주세요.' : ''}</p>` + matches.map((item) => `<article class="forgotten-result">${item.image ? `<img src="${esc(item.image)}" alt="${esc(item.name)} 사진" loading="lazy" />` : ''}<div class="forgotten-result-body"><div class="name">${esc(item.name)}</div><div class="meta">${item.kind === 'warehouse' ? 'COS 물품' : '시나리오 물품'}</div><div class="location">${esc(item.location || '위치 미등록')}</div></div></article>`).join('') : '<p class="forgotten-message">일치하는 물품이 없어요. 다른 이름으로 다시 찾아보세요.</p>';
        } catch (e) {
          if (current()) output.innerHTML = `<p class="forgotten-message error">${esc(e.name === 'TimeoutError' ? '조회가 지연되고 있어요. 다시 시도해 주세요.' : e.message || '위치를 찾지 못했습니다. 다시 시도해 주세요.')}</p>`;
        } finally {
          if (current()) { searchButton.disabled = false; searchButton.textContent = '위치 찾기'; }
        }
      });
    };
    const renderItems = () => {
      // 처리 내역 안내를 열었을 때는 그것을 먼저 보여준다. 닫으면 아직 확인 안 한 일방통행 안내가 이어서 나온다.
      if (routeNoticePending && activeTab !== "history") {
        items.innerHTML = `<section class="route-notice-inline" aria-labelledby="route-notice-title"><div class="route-notice-icon" aria-hidden="true">→</div><div class="route-notice-label">대여 · 반납 공통 안내</div><h2 id="route-notice-title">일방통행으로 이동해주세요</h2><p>안전하고 원활한 이동을 위해 화면에 표시되는 물품 순서대로 이동해주세요.</p><button type="button" class="route-notice-confirm">확인</button></section>`;
        const confirm = items.querySelector(".route-notice-confirm");
        confirm.addEventListener("click", () => {
          routeNoticePending = false;
          renderItems();
          window.scrollTo({ top: items.offsetTop - 74, behavior: "smooth" });
        });
        requestAnimationFrame(() => confirm.focus());
        return;
      }
      if (activeTab === "history") {
        // 이번 근무일 처리 내역(반납·취소)은 WMS 메인 화면의 '내 대여 조회'로 옮겼다. 여기서는 어디서 보는지만 안내한다.
        borrowTab.classList.remove("active"); returnTab.classList.remove("active");
        borrowTab.setAttribute("aria-selected", "false"); returnTab.setAttribute("aria-selected", "false");
        items.innerHTML = `<section class="route-notice-inline" aria-labelledby="history-notice-title"><div class="route-notice-icon" aria-hidden="true">↗</div><div class="route-notice-label">처리 내역 안내</div><h2 id="history-notice-title">‘내 대여 조회’에서 확인할 수 있어요</h2><p>이번 근무일에 처리된 반납·취소 내역은 WMS 메인 화면의 ‘내 대여 조회’로 옮겼습니다. 아래 주소에 접속해 사번으로 로그인한 뒤 ‘내 대여 조회’를 눌러 확인하세요.</p><a class="route-notice-url" href="${esc(MAIN_APP_URL)}">${esc(MAIN_APP_URL)}</a><button type="button" class="route-notice-confirm">닫기</button></section>`;
        items.querySelector(".route-notice-confirm").addEventListener("click", () => {
          activeTab = nextTab();
          renderItems();
        });
        return;
      }
      if (activeTab === "empty") {
        borrowTab.classList.remove("active"); returnTab.classList.remove("active");
        borrowTab.setAttribute("aria-selected", "false"); returnTab.setAttribute("aria-selected", "false");
        renderLocationSearch();
        return;
      }
      const selected = orderedItems(activeTab);
      borrowTab.classList.toggle("active", activeTab === "borrow"); returnTab.classList.toggle("active", activeTab === "return");
      borrowTab.setAttribute("aria-selected", String(activeTab === "borrow")); returnTab.setAttribute("aria-selected", String(activeTab === "return"));
      if (!selected.length) { items.innerHTML = `<div class="empty">${activeTab === "return" ? "제자리에 놓을 반납 물품이 없습니다." : "대여 확인을 기다리는 물품이 없습니다."}</div>`; return; }
      const validKeys = new Set(selected.map(itemKey));
      const doneKeys = readDone(activeTab).filter((key) => validKeys.has(key));
      writeDone(activeTab, doneKeys);
      const doneSet = new Set(doneKeys);
      const current = selected.find((item) => !doneSet.has(itemKey(item)));
      if (!current) {
        // 이 탭에서 더 확인할 물품이 없으면 남은 탭으로 넘기고, 둘 다 없으면 빈 화면을 보여준다.
        refreshTabs();
        activeTab = nextTab();
        renderItems();
        return;
      }
      const completed = doneKeys.length, total = selected.length, percent = Math.round((completed / total) * 100);
      items.innerHTML = `<section class="flow"><div class="flow-head"><div><div class="flow-kicker">${activeTab === "return" ? "반납 동선" : "픽업 동선"}</div><h2>${completed + 1}번째 물품</h2></div><div class="flow-step">${completed + 1} / ${total}</div></div><div class="flow-track"><span style="width:${percent}%"></span></div>${cardHtml(current)}<button type="button" class="flow-confirm">${activeTab === "return" ? "이 물품을 제자리에 반납했어요" : "이 물품을 가져갔어요"}</button><p class="flow-help">${activeTab === "return" ? "반납 처리 후 30분이 지나면 누르지 않아도 이 위치 안내가 자동으로 종료됩니다." : "확인해야 다음 물품과 위치가 표시됩니다."}</p></section>`;
      items.querySelector(".flow-confirm").addEventListener("click", () => {
        const nextDone = doneKeys.concat(itemKey(current));
        writeDone(activeTab, nextDone);
        refreshTabs();
        if (navigator.vibrate) navigator.vibrate(18);
        renderItems();
        window.scrollTo({ top: (activeTab === 'empty' ? items : activityTabs).offsetTop - 68, behavior: "smooth" });
      });
    };
    const switchTab = (next) => {
      if (activeTab === next) return;
      const scrollBefore = window.scrollY;
      contentMinHeight = Math.max(contentMinHeight, items.offsetHeight);
      items.style.minHeight = `${contentMinHeight}px`;
      activeTab = next;
      if (navigator.vibrate) navigator.vibrate(12);
      renderItems();
      // 탭마다 물품 수가 달라도 문서 높이가 갑자기 줄지 않게 하고 현재 읽던 위치를 유지한다.
      requestAnimationFrame(() => {
        contentMinHeight = Math.max(contentMinHeight, items.scrollHeight);
        items.style.minHeight = `${contentMinHeight}px`;
        window.scrollTo({ top: scrollBefore, left: 0, behavior: "auto" });
      });
    };
    borrowTab.addEventListener("click", () => switchTab("borrow"));
    returnTab.addEventListener("click", () => switchTab("return"));
    // 처리 내역 버튼: 목록 대신 '내 대여 조회'에서 볼 수 있다는 안내를 보여준다.
    statusButton.addEventListener("click", () => {
      if (statusButton.disabled) return;
      activeTab = "history";
      renderItems();
      window.scrollTo({ top: result.offsetTop - 60, behavior: "smooth" });
    });
    const preset = new URLSearchParams(location.search).get("employeeId") || "";
    // 사번이 포함된 QR 링크도 조회 후 공통 동선 안내를 먼저 보여준다.
    if (/^\d{4}$/.test(preset)) { employeeInput.value = preset; setTimeout(() => form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event("submit", { cancelable: true })), 0); }
    employeeInput.addEventListener("input", () => { employeeInput.value = employeeInput.value.replace(/\D/g, "").slice(0, 4); error.hidden = true; });
    const applyLookupData = (data, preserveTab) => {
      currentEmployeeId = String(data.employeeId || currentEmployeeId);
      document.getElementById("number").textContent = `${data.borrowerName} · ${data.employeeId}`;
      loadedItems = (data.items || []).map((item) => ({ ...item, returnSource: item.returnSource || (item.cancelled ? "cancel" : "") }));
      refreshTabs();
      const borrowPending = pendingCount("borrow"), returnPending = pendingCount("return");
      const next = nextTab();
      // 이번 근무일에 처리된 물품(반납·대여 확인 전 취소)이 있을 때만 버튼을 보인다. 누르면 '내 대여 조회' 안내가 열린다.
      const handledToday = loadedItems.filter((item) => item.returned), returnedToday = handledToday.filter((item) => !isCancelled(item)).length, cancelledToday = handledToday.filter(isCancelled).length;
      statusButton.textContent = returnedToday && cancelledToday ? `이번 근무일 · 반납 ${returnedToday}종 · 취소 ${cancelledToday}종 보기` : returnedToday ? `이번 근무일 반납 · ${returnedToday}종 보기` : `이번 근무일 취소 · ${cancelledToday}종 보기`;
      statusButton.hidden = handledToday.length === 0;
      statusButton.disabled = handledToday.length === 0;
      if (!preserveTab || activeTab === "empty" || (activeTab === "borrow" && !borrowPending) || (activeTab === "return" && !returnPending) || (activeTab === "history" && !handledToday.length)) activeTab = next;
      if (!preserveTab) routeNoticePending = true;
      contentMinHeight = 0; items.style.minHeight = "0";
      renderItems();
      result.hidden = false;
    };
    const loadLookup = async (employeeId, silent = false) => {
      if (!silent) { button.disabled = true; button.textContent = "조회 중"; error.hidden = true; result.hidden = true; }
      try {
        const response = await fetch(BASE + "/api?employeeId=" + encodeURIComponent(employeeId), { cache:"no-store" });
        // 서버 재시작 중 등으로 JSON이 아닌 응답이 오면 파싱 오류 문구 대신 안내를 보여준다.
        const data = await response.json().catch(() => ({ success: false, error: response.status === 429 ? "잠시 후 다시 시도해주세요." : "서버 응답을 읽지 못했습니다. 잠시 후 다시 시도해주세요." }));
        if (!response.ok || !data.success) throw new Error(data.error || "조회하지 못했습니다.");
        if (!data.found) throw new Error("등록된 사번을 찾지 못했습니다. 사번을 다시 확인해주세요.");
        applyLookupData(data, silent);
      } catch (e) {
        if (!silent) { error.textContent = e.message || "조회 중 오류가 발생했습니다."; error.hidden = false; }
      } finally {
        if (!silent) { button.disabled = false; button.textContent = "조회"; }
      }
    };
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      locationSearchEpoch++;
      const employeeId = employeeInput.value.replace(/\D/g, "");
      if (employeeId.length !== 4) {
        // 휴대폰을 돌려 쓰는 경우 앞사람의 조회 결과와 자동 새로고침이 남지 않게 한다.
        window.clearInterval(pollTimer); result.hidden = true; loadedItems = [];
        error.textContent = "4자리 사번을 입력해주세요."; error.hidden = false; return;
      }
      currentEmployeeId = employeeId;
      window.clearInterval(pollTimer);
      await loadLookup(employeeId);
      // 관리자 확인 상태는 자동 반영하되, QR 사용자가 여럿이어도 조회 제한에 걸리지 않도록
      // 짧은 연속 요청 대신 15초 간격으로만 갱신한다.
      if (!result.hidden) pollTimer = window.setInterval(() => loadLookup(employeeId, true), 15000);
    });
  </script>
</body>
</html>
